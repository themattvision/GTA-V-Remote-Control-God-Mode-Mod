name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version
        required: true
        default: 0.3.0

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install MinGW x64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile ScriptHook companion module
        shell: msys2 {0}
        run: |
          output_directory="$(cygpath -u '${{ runner.temp }}')/GodModeInstaller/prebuilt"
          mkdir -p "$output_directory"
          dlltool -d Mods/GTARemoteBridge/ScriptHookV.def -l "$output_directory/libScriptHookV.a"
          g++ -std=c++17 -O2 -shared -static-libgcc -static-libstdc++ \
            -o "$output_directory/GTARemoteBridge.asi" \
            Mods/GTARemoteBridge/GTARemoteBridge.cpp \
            "$output_directory/libScriptHookV.a" \
            -Wl,--subsystem,windows

      - name: Build app, ASI module and installer
        shell: pwsh
        run: >-
          ./Scripts/build-windows-installer.ps1
          -Version '${{ inputs.version }}'
          -OutputDirectory '${{ runner.temp }}\GodModeInstaller'
          -MingwBin '${{ steps.msys2.outputs.msys2-location }}\mingw64\bin'
          -InnoSetupCompiler 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          -PrebuiltModBinary '${{ runner.temp }}\GodModeInstaller\prebuilt\GTARemoteBridge.asi'

      - name: Inspect Windows binaries
        shell: pwsh
        run: |
          $mod = '${{ runner.temp }}\GodModeInstaller\build\mod\GTARemoteBridge.asi'
          $installer = '${{ runner.temp }}\GodModeInstaller\installer\Windows-GodMode-Mod-Remote-Control-Setup-v${{ inputs.version }}.exe'
          if (-not (Test-Path $mod)) { throw "GTARemoteBridge.asi missing" }
          if (-not (Test-Path $installer)) { throw "Installer missing" }
          $modInfo = & '${{ steps.msys2.outputs.msys2-location }}\mingw64\bin\objdump.exe' -p $mod | Out-String
          if ($modInfo -notmatch 'pei-x86-64') { throw "GTARemoteBridge.asi is not a Windows x64 PE binary" }
          if ($modInfo -notmatch 'ScriptHookV.dll') { throw "GTARemoteBridge.asi does not import ScriptHookV.dll" }
          Get-FileHash $mod -Algorithm SHA256
          Get-FileHash $installer -Algorithm SHA256

      - name: Smoke test guided install and uninstall
        shell: pwsh
        run: |
          $installer = '${{ runner.temp }}\GodModeInstaller\installer\Windows-GodMode-Mod-Remote-Control-Setup-v${{ inputs.version }}.exe'
          $fakeGta = Join-Path '${{ runner.temp }}' 'Fake GTA V'
          $appDirectory = Join-Path '${{ runner.temp }}' 'Installed GodMode Remote'
          $installLog = Join-Path '${{ runner.temp }}' 'godmode-installer-smoke.log'
          New-Item $fakeGta -ItemType Directory -Force | Out-Null
          @('GTA5.exe', 'ScriptHookV.dll', 'dinput8.dll', 'NativeTrainer.asi') | ForEach-Object {
            Set-Content (Join-Path $fakeGta $_) 'installer-smoke-test'
          }

          $installArguments = @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            "/GTAPath=`"$fakeGta`"",
            "/DIR=`"$appDirectory`"",
            "/LOG=`"$installLog`""
          )
          $installProcess = Start-Process $installer -ArgumentList $installArguments -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) {
            if (Test-Path $installLog) { Get-Content $installLog }
            throw "Installer exited with $($installProcess.ExitCode)"
          }
          if (-not (Test-Path (Join-Path $appDirectory 'GodMode Mod Remote Control.exe'))) { throw 'Windows app was not installed' }
          if (-not (Test-Path (Join-Path $fakeGta 'GTARemoteBridge.asi'))) { throw 'GTA bridge was not installed' }

          $uninstaller = Join-Path $appDirectory 'unins000.exe'
          $uninstallProcess = Start-Process $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstallProcess.ExitCode)" }
          if (Test-Path (Join-Path $fakeGta 'GTARemoteBridge.asi')) { throw 'GTA bridge was not removed' }
          @('ScriptHookV.dll', 'dinput8.dll', 'NativeTrainer.asi') | ForEach-Object {
            if (-not (Test-Path (Join-Path $fakeGta $_))) { throw "Shared dependency $_ was incorrectly removed" }
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-GodMode-Mod-Remote-Control-Setup-v${{ inputs.version }}
          path: ${{ runner.temp }}\GodModeInstaller\installer\Windows-GodMode-Mod-Remote-Control-Setup-v${{ inputs.version }}.exe
          if-no-files-found: error
          retention-days: 14
