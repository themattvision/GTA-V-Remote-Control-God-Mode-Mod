name: GTARemote

options:
  bundleIdPrefix: com.matteozampieri
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  GTAControlCore:
    path: Packages/GTAControlCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_APPROACHABLE_CONCURRENCY: YES

targets:
  GTARemote:
    type: application
    platform: iOS
    sources:
      - iOS/GTARemote
    info:
      path: Config/GTARemote-Info.plist
      properties:
        CFBundleDisplayName: GTA Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: GTA Remote cerca e controlla il bridge sul tuo Mac nella stessa rete Wi-Fi.
        NSBonjourServices:
          - _gtactrl._tcp
    dependencies:
      - package: GTAControlCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matteozampieri.GTARemote
        PRODUCT_NAME: GTARemote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconiOS
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 4
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7HB6926XLK
        TARGETED_DEVICE_FAMILY: "1"

  GTABridge:
    type: application
    platform: macOS
    sources:
      - macOS/GTABridge
    info:
      path: Config/GTABridge-Info.plist
      properties:
        CFBundleDisplayName: GTA Bridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSLocalNetworkUsageDescription: GTA Bridge riceve comandi autorizzati dall'iPhone nella stessa rete Wi-Fi.
        NSBonjourServices:
          - _gtactrl._tcp
    dependencies:
      - package: GTAControlCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matteozampieri.GTABridge
        PRODUCT_NAME: GTABridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMac
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 4
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7HB6926XLK
        ENABLE_APP_SANDBOX: NO
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  GTARemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/GTARemoteTests
    dependencies:
      - target: GTARemote
      - package: GTAControlCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  GTABridgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/GTABridgeTests
    dependencies:
      - target: GTABridge
      - package: GTAControlCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GTARemote:
    build:
      targets:
        GTARemote: all
        GTARemoteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GTARemoteTests

  GTABridge:
    build:
      targets:
        GTABridge: all
        GTABridgeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GTABridgeTests
